<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" style="background-color: #030712; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Glassmorphism Card Gradients -->
    <linearGradient id="glass-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neon-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4" />
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg-glow)"/>

  <!-- Futuristic Background Grid -->
  <g opacity="0.05">
    <path d="M 0,100 H 1200 M 0,200 H 1200 M 0,300 H 1200 M 0,400 H 1200 M 0,500 H 1200 M 0,600 H 1200 M 0,700 H 1200 M 0,800 H 1200" stroke="#a855f7" stroke-width="1"/>
    <path d="M 100,0 V 900 M 200,0 V 900 M 300,0 V 900 M 400,0 V 900 M 500,0 V 900 M 600,0 V 900 M 700,0 V 900 M 800,0 V 900 M 900,0 V 900 M 1000,0 V 900 M 1100,0 V 900" stroke="#06b6d4" stroke-width="1"/>
  </g>

  <!-- HEADER TITLE -->
  <g transform="translate(0, 45)">
    <text x="600" y="25" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="900" letter-spacing="3">ARCHITECTURE IRC MONO-THREAD</text>
    <text x="600" y="50" text-anchor="middle" fill="#64748b" font-size="13" font-weight="600" letter-spacing="1">EVENT-DRIVEN MULTIPLEXING • C++ NON-BLOQUANT</text>
  </g>

  <!-- EVENT LOOP OUTER FRAME -->
  <rect x="60" y="120" width="1080" height="730" rx="28" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 6"/>
  
  <!-- Event Loop Header Tag -->
  <g transform="translate(90, 105)">
    <rect width="250" height="30" rx="15" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" filter="url(#neon-cyan)"/>
    <text x="125" y="19" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="800" letter-spacing="1.5">⚡ EVENT LOOP (SELECT CYCLE)</text>
  </g>

  <!-- LOOP BACK DASHED TRACK -->
  <path d="M 100,790 H 80 V 270 H 115" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6 4" fill="none" opacity="0.6" marker-end="url(#arr-cyan)"/>
  <text x="65" y="530" text-anchor="middle" fill="#06b6d4" font-size="10" font-weight="700" letter-spacing="1" transform="rotate(-90 65 530)">RECYCLE / SELECT()</text>

  <!-- STAGE 1 -->
  <g transform="translate(130, 150)">
    <rect width="940" height="95" rx="16" fill="url(#glass-card)" stroke="#06b6d4" stroke-width="1.5" filter="url(#neon-cyan)"/>
    <line x1="0" y1="0" x2="0" y2="95" stroke="#06b6d4" stroke-width="6"/>

    <g transform="translate(25, 20)">
      <circle cx="28" cy="28" r="26" fill="#082f49"/>
      <path d="M 20,16 V 28 M 36,16 V 28 M 16,28 H 40 V 38 C 40,41 37,43 34,43 H 22 C 19,43 16,41 16,38 Z" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>

    <text x="95" y="38" fill="#38bdf8" font-size="11" font-weight="800" letter-spacing="1.5">ÉTAPE 01</text>
    <text x="95" y="64" fill="#f8fafc" font-size="18" font-weight="800">ÉCOUTE ET INITIALISATION</text>

    <text x="400" y="42" fill="#94a3b8" font-size="13">• Socket TCP non-bloquant</text>
    <text x="400" y="65" fill="#94a3b8" font-size="13">• Bind du port &amp; Listen</text>

    <rect x="710" y="28" width="200" height="38" rx="8" fill="#030712" stroke="#0284c7" stroke-width="1"/>
    <text x="810" y="52" text-anchor="middle" fill="#38bdf8" font-size="12" font-family="monospace" font-weight="700">Server.cpp</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 600,245 V 280" stroke="#06b6d4" stroke-width="2.5" fill="none" marker-end="url(#arr-cyan)"/>

  <!-- STAGE 2 -->
  <g transform="translate(130, 285)">
    <rect width="940" height="100" rx="16" fill="url(#glass-card)" stroke="#a855f7" stroke-width="1.5" filter="url(#neon-purple)"/>
    <line x1="0" y1="0" x2="0" y2="100" stroke="#a855f7" stroke-width="6"/>

    <g transform="translate(25, 22)">
      <circle cx="28" cy="28" r="26" fill="#3b0764"/>
      <circle cx="28" cy="28" r="18" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="28" cy="28" r="9" fill="none" stroke="#c084fc" stroke-width="1.5"/>
      <path d="M 28,28 L 41,15" stroke="#e9d5ff" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <text x="95" y="38" fill="#c084fc" font-size="11" font-weight="800" letter-spacing="1.5">ÉTAPE 02</text>
    <text x="95" y="64" fill="#f8fafc" font-size="18" font-weight="800">MULTIPLEXAGE SELECT()</text>

    <text x="400" y="42" fill="#94a3b8" font-size="13">• Surveillance active (1024 FDs max)</text>
    <text x="400" y="65" fill="#94a3b8" font-size="13">• Détection non-bloquante des événements</text>

    <rect x="710" y="30" width="200" height="38" rx="8" fill="#030712" stroke="#7e22ce" stroke-width="1"/>
    <text x="810" y="54" text-anchor="middle" fill="#c084fc" font-size="12" font-family="monospace" font-weight="700">main.cpp (select loop)</text>
  </g>

  <!-- Branching Connectors -->
  <path d="M 360,385 V 425 H 330" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#arr-emerald)"/>
  <rect x="250" y="396" width="120" height="22" rx="6" fill="#030712" stroke="#10b981" stroke-width="1"/>
  <text x="310" y="411" text-anchor="middle" fill="#34d399" font-size="10" font-weight="800">NOUVEAU CLIENT</text>

  <path d="M 840,385 V 425 H 870" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#arr-emerald)"/>
  <rect x="830" y="396" width="130" height="22" rx="6" fill="#030712" stroke="#10b981" stroke-width="1"/>
  <text x="895" y="411" text-anchor="middle" fill="#34d399" font-size="10" font-weight="800">DONNÉES ENTRANTES</text>

  <!-- STAGE 3A & 3B -->
  <g transform="translate(130, 430)">
    <rect width="440" height="115" rx="16" fill="url(#glass-card)" stroke="#10b981" stroke-width="1.5" filter="url(#neon-emerald)"/>
    <line x1="0" y1="0" x2="0" y2="115" stroke="#10b981" stroke-width="6"/>

    <g transform="translate(20, 20)">
      <circle cx="22" cy="22" r="22" fill="#064e3b"/>
      <path d="M 14,22 H 30 M 22,14 V 30" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <text x="75" y="32" fill="#34d399" font-size="11" font-weight="800" letter-spacing="1">3a. CONNEXION</text>
    <text x="75" y="54" fill="#f8fafc" font-size="16" font-weight="800">ACCEPT()</text>
    <text x="20" y="90" fill="#94a3b8" font-size="12">• Client accepté &amp; FD ajouté au tableau</text>

    <rect x="250" y="18" width="170" height="32" rx="6" fill="#030712" stroke="#047857" stroke-width="1"/>
    <text x="335" y="39" text-anchor="middle" fill="#34d399" font-size="11" font-family="monospace" font-weight="700">addClient()</text>
  </g>

  <g transform="translate(630, 430)">
    <rect width="440" height="115" rx="16" fill="url(#glass-card)" stroke="#10b981" stroke-width="1.5" filter="url(#neon-emerald)"/>
    <line x1="0" y1="0" x2="0" y2="115" stroke="#10b981" stroke-width="6"/>

    <g transform="translate(20, 20)">
      <circle cx="22" cy="22" r="22" fill="#064e3b"/>
      <path d="M 12,16 H 32 M 12,22 H 28 M 12,28 H 22" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <text x="75" y="32" fill="#34d399" font-size="11" font-weight="800" letter-spacing="1">3b. LECTURE</text>
    <text x="75" y="54" fill="#f8fafc" font-size="16" font-weight="800">RECV &amp; BUFFER</text>
    <text x="20" y="90" fill="#94a3b8" font-size="12">• Agrégation des paquets partiels (bufTmp)</text>

    <rect x="250" y="18" width="170" height="32" rx="6" fill="#030712" stroke="#047857" stroke-width="1"/>
    <text x="335" y="39" text-anchor="middle" fill="#34d399" font-size="11" font-family="monospace" font-weight="700">recv() + PUSH/DEL</text>
  </g>

  <path d="M 850,545 V 580" stroke="#f59e0b" stroke-width="2.5" fill="none" marker-end="url(#arr-amber)"/>
  <rect x="780" y="550" width="140" height="20" rx="6" fill="#030712" stroke="#f59e0b" stroke-width="1"/>
  <text x="850" y="564" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="800">COMMANDE COMPLÈTE</text>

  <!-- STAGE 4 -->
  <g transform="translate(130, 585)">
    <rect width="940" height="110" rx="16" fill="url(#glass-card)" stroke="#f59e0b" stroke-width="1.5" filter="url(#neon-amber)"/>
    <line x1="0" y1="0" x2="0" y2="110" stroke="#f59e0b" stroke-width="6"/>

    <g transform="translate(25, 25)">
      <circle cx="28" cy="28" r="26" fill="#451a03"/>
      <path d="M 16,28 H 40 M 31,19 L 40,28 L 31,37" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="95" y="38" fill="#fbbf24" font-size="11" font-weight="800" letter-spacing="1.5">ÉTAPE 04</text>
    <text x="95" y="64" fill="#f8fafc" font-size="18" font-weight="800">DISPATCHING DES COMMANDES</text>

    <text x="410" y="42" fill="#94a3b8" font-size="13">• Routage dynamique (switch-case sur 12 commandes)</text>
    
    <g transform="translate(410, 56)">
      <rect x="0" y="0" width="55" height="22" rx="5" fill="#030712" stroke="#78350f" stroke-width="1"/><text x="27" y="15" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="700">JOIN</text>
      <rect x="63" y="0" width="70" height="22" rx="5" fill="#030712" stroke="#78350f" stroke-width="1"/><text x="98" y="15" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="700">PRIVMSG</text>
      <rect x="141" y="0" width="55" height="22" rx="5" fill="#030712" stroke="#78350f" stroke-width="1"/><text x="168" y="15" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="700">NICK</text>
      <rect x="204" y="0" width="55" height="22" rx="5" fill="#030712" stroke="#78350f" stroke-width="1"/><text x="231" y="15" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="700">MODE</text>
    </g>

    <rect x="710" y="32" width="200" height="38" rx="8" fill="#030712" stroke="#b45309" stroke-width="1"/>
    <text x="810" y="56" text-anchor="middle" fill="#fbbf24" font-size="12" font-family="monospace" font-weight="700">ServerSwitch.cpp</text>
  </g>

  <!-- Connector Dispatch -> Channels -->
  <path d="M 600,695 V 725" stroke="#f43f5e" stroke-width="2.5" fill="none" marker-end="url(#arr-rose)"/>

  <!-- STAGE 5 -->
  <g transform="translate(130, 730)">
    <rect width="940" height="95" rx="16" fill="url(#glass-card)" stroke="#f43f5e" stroke-width="1.5" filter="url(#neon-rose)"/>
    <line x1="0" y1="0" x2="0" y2="95" stroke="#f43f5e" stroke-width="6"/>

    <g transform="translate(25, 20)">
      <circle cx="28" cy="28" r="26" fill="#4c0519"/>
      <circle cx="20" cy="22" r="8" fill="#fb7185"/>
      <circle cx="36" cy="22" r="8" fill="#f43f5e"/>
      <path d="M 12,40 C 12,32 28,32 28,40 M 28,40 C 28,33 44,33 44,40" stroke="#ffffff" stroke-width="2" fill="none"/>
    </g>

    <text x="95" y="38" fill="#fb7185" font-size="11" font-weight="800" letter-spacing="1.5">ÉTAPE 05</text>
    <text x="95" y="64" fill="#f8fafc" font-size="18" font-weight="800">CANAUX, MODES &amp; ÉTATS</text>

    <text x="410" y="42" fill="#94a3b8" font-size="13">• Gestion des membres, privilèges ops, topics &amp; modes</text>
    <text x="410" y="65" fill="#94a3b8" font-size="13">• Broadcast des messages au sein des canaux</text>

    <rect x="690" y="28" width="230" height="38" rx="8" fill="#030712" stroke="#be123c" stroke-width="1"/>
    <text x="805" y="52" text-anchor="middle" fill="#fb7185" font-size="11" font-family="monospace" font-weight="700">Channel.cpp / ServerMode.cpp</text>
  </g>
</svg>
