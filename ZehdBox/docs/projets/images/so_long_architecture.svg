<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1150" width="1400" height="1150" style="background-color: #030712; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: block;">
  <defs>
    <!-- Dark Radial Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Glassmorphism Card Gradients -->
    <linearGradient id="glass-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Phase Containers Gradients -->
    <linearGradient id="phase1-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="neon-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1150" fill="url(#bg-glow)"/>

  <!-- Futuristic Background Grid -->
  <g opacity="0.04">
    <path d="M 0,100 H 1400 M 0,200 H 1400 M 0,300 H 1400 M 0,400 H 1400 M 0,500 H 1400 M 0,600 H 1400 M 0,700 H 1400 M 0,800 H 1400 M 0,900 H 1400 M 0,1000 H 1400 M 0,1100 H 1400" stroke="#a855f7" stroke-width="1"/>
    <path d="M 100,0 V 1150 M 200,0 V 1150 M 300,0 V 1150 M 400,0 V 1150 M 500,0 V 1150 M 600,0 V 1150 M 700,0 V 1150 M 800,0 V 1150 M 900,0 V 1150 M 1000,0 V 1150 M 1100,0 V 1150 M 1200,0 V 1150 M 1300,0 V 1150" stroke="#06b6d4" stroke-width="1"/>
  </g>

  <!-- HEADER TITLE -->
  <g transform="translate(0, 45)">
    <text x="700" y="25" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="900" letter-spacing="3">ARCHITECTURE SO_LONG</text>
    <text x="700" y="55" text-anchor="middle" fill="#64748b" font-size="14" font-weight="600" letter-spacing="1.5">PARSING DU FICHIER .BER &amp; BOUCLE D'ÉVÉNEMENT MINILIBX (2D)</text>
  </g>

  <!-- ==================== PHASE 1: VALIDATION DE LA CARTE ==================== -->
  <rect x="70" y="130" width="1260" height="420" rx="20" fill="url(#phase1-grad)" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 6"/>
  
  <g transform="translate(100, 115)">
    <rect width="280" height="32" rx="16" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" filter="url(#neon-cyan)"/>
    <text x="140" y="20" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="800" letter-spacing="1.5">PHASE 1 : VALIDATION CARTE</text>
  </g>

  <!-- ÉTAPE 1: LECTURE & VÉRIFS -->
  <g transform="translate(120, 160)">
    <rect width="1160" height="95" rx="16" fill="url(#glass-card)" stroke="#06b6d4" stroke-width="1.5" filter="url(#neon-cyan)"/>
    <line x1="0" y1="0" x2="0" y2="95" stroke="#06b6d4" stroke-width="6"/>

    <g transform="translate(30, 18)">
      <circle cx="30" cy="30" r="26" fill="#082f49"/>
      <path d="M 20,18 H 36 M 20,26 H 40 M 20,34 H 32 M 20,42 H 38" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <text x="110" y="38" fill="#38bdf8" font-size="11" font-weight="800" letter-spacing="1.5">ÉCOUTE ET ENTRÉE</text>
    <text x="110" y="64" fill="#f8fafc" font-size="18" font-weight="800">1. LECTURE &amp; VÉRIFICATIONS</text>

    <text x="440" y="42" fill="#94a3b8" font-size="14">• Extension .ber valide &amp; contrôle argc</text>
    <text x="440" y="66" fill="#94a3b8" font-size="14">• Ouverture et vérification du descripteur de fichier</text>

    <rect x="870" y="28" width="260" height="40" rx="8" fill="#030712" stroke="#0284c7" stroke-width="1"/>
    <text x="1000" y="53" text-anchor="middle" fill="#38bdf8" font-size="13" font-family="monospace" font-weight="700">open_file() (so_long_utils.c)</text>
  </g>

  <path d="M 700,255 V 285" stroke="#06b6d4" stroke-width="2.5" fill="none" marker-end="url(#arr-cyan)"/>

  <!-- ÉTAPE 2: PARSING -->
  <g transform="translate(120, 290)">
    <rect width="1160" height="100" rx="16" fill="url(#glass-card)" stroke="#a855f7" stroke-width="1.5" filter="url(#neon-purple)"/>
    <line x1="0" y1="0" x2="0" y2="100" stroke="#a855f7" stroke-width="6"/>

    <g transform="translate(30, 20)">
      <circle cx="30" cy="30" r="26" fill="#3b0764"/>
      <path d="M 18,18 H 42 V 42 H 18 Z M 24,24 H 36 M 24,30 H 36 M 24,36 H 30" stroke="#c084fc" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <text x="110" y="38" fill="#c084fc" font-size="11" font-weight="800" letter-spacing="1.5">CONTRÔLE DE SURFACE</text>
    <text x="110" y="64" fill="#f8fafc" font-size="18" font-weight="800">2. PARSING DE LA CARTE</text>

    <text x="440" y="42" fill="#94a3b8" font-size="14">• Caractères autorisés (0, 1, P, E, C) &amp; bordures fermées</text>
    <text x="440" y="66" fill="#94a3b8" font-size="14">• Validations : 1 Joueur, 1 Sortie, ≥ 1 Item à collecter</text>

    <rect x="870" y="30" width="260" height="40" rx="8" fill="#030712" stroke="#7e22ce" stroke-width="1"/>
    <text x="1000" y="55" text-anchor="middle" fill="#c084fc" font-size="13" font-family="monospace" font-weight="700">ft_parsing.c</text>
  </g>

  <path d="M 700,390 V 420" stroke="#a855f7" stroke-width="2.5" fill="none" marker-end="url(#arr-purple)"/>

  <!-- ÉTAPE 3: CHEMIN -->
  <g transform="translate(120, 425)">
    <rect width="1160" height="100" rx="16" fill="url(#glass-card)" stroke="#10b981" stroke-width="1.5" filter="url(#neon-emerald)"/>
    <line x1="0" y1="0" x2="0" y2="100" stroke="#10b981" stroke-width="6"/>

    <g transform="translate(30, 20)">
      <circle cx="30" cy="30" r="26" fill="#064e3b"/>
      <path d="M 18,38 C 22,26 26,40 32,24 M 32,24 L 26,26 M 32,24 L 30,30" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <text x="110" y="38" fill="#34d399" font-size="11" font-weight="800" letter-spacing="1.5">VALDATION ALGORITHMIQUE</text>
    <text x="110" y="64" fill="#f8fafc" font-size="18" font-weight="800">3. VÉRIFICATION DU CHEMIN</text>

    <text x="440" y="42" fill="#94a3b8" font-size="14">• Copie de la carte temporaire (duplicate_map)</text>
    <text x="440" y="66" fill="#94a3b8" font-size="14">• Flood-fill récursif depuis la position du joueur</text>

    <rect x="870" y="30" width="260" height="40" rx="8" fill="#030712" stroke="#047857" stroke-width="1"/>
    <text x="1000" y="55" text-anchor="middle" fill="#34d399" font-size="13" font-family="monospace" font-weight="700">ft_parse_road.c</text>
  </g>

  <!-- Connecteur Phase 1 -> Phase 2 -->
  <path d="M 700,550 V 600" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arr-emerald)"/>
  <rect x="610" y="563" width="180" height="24" rx="6" fill="#030712" stroke="#10b981" stroke-width="1"/>
  <text x="700" y="579" text-anchor="middle" fill="#34d399" font-size="11" font-weight="800">CARTE 100% VALIDE</text>

  <!-- ==================== PHASE 2: FENÊTRE & BOUCLE MINILIBX ==================== -->
  <g transform="translate(0, 50)">
    <rect x="70" y="580" width="1260" height="480" rx="20" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 6"/>

    <g transform="translate(100, 565)">
      <rect width="320" height="32" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" filter="url(#neon-amber)"/>
      <text x="160" y="20" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="800" letter-spacing="1.5">PHASE 2 : RENDU &amp; BOUCLE JEU</text>
    </g>

    <!-- ÉTAPE 4: FENÊTRE & SPRITES -->
    <g transform="translate(120, 610)">
      <rect width="1160" height="100" rx="16" fill="url(#glass-card)" stroke="#f59e0b" stroke-width="1.5" filter="url(#neon-amber)"/>
      <line x1="0" y1="0" x2="0" y2="100" stroke="#f59e0b" stroke-width="6"/>

      <g transform="translate(30, 20)">
        <circle cx="30" cy="30" r="26" fill="#451a03"/>
        <rect x="18" y="20" width="24" height="20" rx="3" stroke="#fbbf24" stroke-width="2" fill="none"/>
        <path d="M 18,26 H 42 M 24,20 V 40" stroke="#fbbf24" stroke-width="1.5"/>
      </g>

      <text x="110" y="38" fill="#fbbf24" font-size="11" font-weight="800" letter-spacing="1.5">INIT GRAPHIQUE</text>
      <text x="110" y="64" fill="#f8fafc" font-size="18" font-weight="800">4. FENÊTRE &amp; SPRITES</text>

      <text x="440" y="42" fill="#94a3b8" font-size="14">• Initialisation MiniLibX via mlx_new_window</text>
      <text x="440" y="66" fill="#94a3b8" font-size="14">• Chargement des images XPM (tuiles 64×64)</text>

      <rect x="870" y="30" width="260" height="40" rx="8" fill="#030712" stroke="#b45309" stroke-width="1"/>
      <text x="1000" y="55" text-anchor="middle" fill="#fbbf24" font-size="13" font-family="monospace" font-weight="700">ft_inits.c</text>
    </g>

    <!-- Connecteurs Parallèles / Boucle -->
    <path d="M 420,710 V 740 H 390" stroke="#f43f5e" stroke-width="2.5" fill="none" marker-end="url(#arr-rose)"/>
    <rect x="300" y="715" width="130" height="22" rx="6" fill="#030712" stroke="#f43f5e" stroke-width="1"/>
    <text x="365" y="730" text-anchor="middle" fill="#fb7185" font-size="10" font-weight="800">HOOKS &amp; EVENTS</text>

    <path d="M 980,710 V 740 H 1010" stroke="#f43f5e" stroke-width="2.5" fill="none" marker-end="url(#arr-rose)"/>
    <rect x="960" y="715" width="130" height="22" rx="6" fill="#030712" stroke="#f43f5e" stroke-width="1"/>
    <text x="1025" y="730" text-anchor="middle" fill="#fb7185" font-size="10" font-weight="800">AFFICHAGE TUILES</text>

    <!-- ÉTAPE 5A: BOUCLE DE JEU -->
    <g transform="translate(120, 745)">
      <rect width="550" height="115" rx="16" fill="url(#glass-card)" stroke="#f43f5e" stroke-width="1.5" filter="url(#neon-rose)"/>
      <line x1="0" y1="0" x2="0" y2="115" stroke="#f43f5e" stroke-width="6"/>

      <g transform="translate(24, 22)">
        <circle cx="24" cy="24" r="24" fill="#4c0519"/>
        <path d="M 16,16 L 24,24 L 16,32 M 24,16 L 32,24 L 24,32" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>

      <text x="85" y="35" fill="#fb7185" font-size="11" font-weight="800" letter-spacing="1">GESTION ÉVÉNEMENTS</text>
      <text x="85" y="60" fill="#f8fafc" font-size="18" font-weight="800">5a. BOUCLE DE JEU</text>
      <text x="24" y="96" fill="#94a3b8" font-size="13">• Hooks clavier, déplacements, fermeture</text>

      <rect x="300" y="20" width="230" height="36" rx="6" fill="#030712" stroke="#9f1239" stroke-width="1"/>
      <text x="415" y="43" text-anchor="middle" fill="#fb7185" font-size="11" font-family="monospace" font-weight="700">main.c / ft_move.c</text>
    </g>

    <!-- ÉTAPE 5B: RENDU -->
    <g transform="translate(730, 745)">
      <rect width="550" height="115" rx="16" fill="url(#glass-card)" stroke="#f43f5e" stroke-width="1.5" filter="url(#neon-rose)"/>
      <line x1="0" y1="0" x2="0" y2="115" stroke="#f43f5e" stroke-width="6"/>

      <g transform="translate(24, 22)">
        <circle cx="24" cy="24" r="24" fill="#4c0519"/>
        <rect x="14" y="14" width="8" height="8" fill="#fb7185"/>
        <rect x="26" y="14" width="8" height="8" fill="#fb7185"/>
        <rect x="14" y="26" width="8" height="8" fill="#fb7185"/>
        <rect x="26" y="26" width="8" height="8" fill="#fb7185"/>
      </g>

      <text x="85" y="35" fill="#fb7185" font-size="11" font-weight="800" letter-spacing="1">RAFRAÎCHISSEMENT</text>
      <text x="85" y="60" fill="#f8fafc" font-size="18" font-weight="800">5b. RENDU GRAPHIQUE</text>
      <text x="24" y="96" fill="#94a3b8" font-size="13">• Redessine la grille tuile par tuile dans la fenêtre</text>

      <rect x="330" y="20" width="200" height="36" rx="6" fill="#030712" stroke="#9f1239" stroke-width="1"/>
      <text x="430" y="43" text-anchor="middle" fill="#fb7185" font-size="12" font-family="monospace" font-weight="700">ft_display.c</text>
    </g>

    <!-- ÉTAPE BONUS -->
    <g transform="translate(120, 890)">
      <rect width="1160" height="90" rx="16" fill="url(#glass-card)" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4 4"/>
      <line x1="0" y1="0" x2="0" y2="90" stroke="#eab308" stroke-width="6"/>

      <g transform="translate(30, 18)">
        <circle cx="28" cy="28" r="26" fill="#713f12"/>
        <path d="M 28,16 L 31,23 L 39,24 L 33,30 L 35,38 L 28,34 L 21,38 L 23,30 L 17,24 L 25,23 Z" fill="#facc15"/>
      </g>

      <text x="110" y="36" fill="#facc15" font-size="11" font-weight="800" letter-spacing="1.5">FONCTIONNALITÉS SUPPLÉMENTAIRES</text>
      <text x="110" y="60" fill="#f8fafc" font-size="18" font-weight="800">BONUS (OPTIONNEL)</text>

      <text x="440" y="40" fill="#94a3b8" font-size="14">• Ennemis (Slimes), animations des sprites</text>
      <text x="440" y="62" fill="#94a3b8" font-size="14">• Compteur de pas directement affiché à l'écran</text>

      <rect x="870" y="25" width="260" height="40" rx="8" fill="#030712" stroke="#ca8a04" stroke-width="1"/>
      <text x="1000" y="50" text-anchor="middle" fill="#facc15" font-size="13" font-family="monospace" font-weight="700">so_long_bonus/</text>
    </g>

    <!-- Piste de Boucle MiniLibX -->
    <path d="M 100,800 H 80 V 795 H 105" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 4" fill="none" opacity="0.6"/>
  </g>
</svg>
