        property: G-74MZWWS1RR

repo_url: https://github.com/Lamizana/ZehdBox
repo_name: Lamizana/ZehdBox
edit_uri: edit/main/ZehdBox/docs/

# ========================= VALIDATION DES LIENS ==============================
# Les liens relatifs vers les posts du blog (../blog/2026/../slug/) pointent
# vers des URLs générées dynamiquement par le plugin blog : MkDocs ne peut pas
# les résoudre statiquement et les signale en INFO. Ils fonctionnent pourtant
# parfaitement à l'exécution. On les ignore pour garder un build propre, tout en
# conservant la détection des vrais liens morts (not_found, anchors).
validation:
  unrecognized_links: ignore
