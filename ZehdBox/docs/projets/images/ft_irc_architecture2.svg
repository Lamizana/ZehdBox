<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="100%" height="100%" style="background-color: #030712; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: block;">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Glassmorphism Card Gradients -->
    <linearGradient id="glass-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neon-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4" />
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1400" height="1000" fill="url(#bg-glow)"/>

  <!-- Futuristic Background Grid -->
  <g opacity="0.04">
    <path d="M 0,100 H 1400 M 0,200 H 1400 M 0,300 H 1400 M 0,400 H 1400 M 0,500 H 1400 M 0,600 H 1400 M 0,700 H 1400 M 0,800 H 1400 M 0,900 H 1400" stroke="#a855f7" stroke-width="1"/>
    <path d="M 100,0 V 1000 M 200,0 V 1000 M 300,0 V 1000 M 400,0 V 1000 M 500,0 V 1000 M 600,0 V 1000 M 700,0 V 1000 M 800,0 V 1000 M 900,0 V 1000 M 1000,0 V 1000 M 1100,0 V 1000 M 1200,0 V 1000 M 1300,0 V 1000" stroke="#06b6d4" stroke-width="1"/>
  </g>

  <!-- HEADER TITLE -->
  <g transform="translate(0, 50)">
    <text x="700" y="25" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="900" letter-spacing="3">ARCHITECTURE IRC MONO-THREAD</text>
    <text x="700" y="55" text-anchor="middle" fill="#64748b" font-size="14" font-weight="600" letter-spacing="1">EVENT-DRIVEN MULTIPLEXING • C++ NON-BLOQUANT</text>
  </g>

  <!-- EVENT LOOP OUTER FRAME -->
  <rect x="70" y="130" width="1260" height="820" rx="28" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 6"/>
  
  <!-- Event Loop Header Tag -->
  <g transform="translate(110, 115)">
    <rect width="280" height="34" rx="17" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" filter="url(#neon-cyan)"/>
    <text x="140" y="21" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="800" letter-spacing="1.5">⚡ EVENT LOOP (SELECT CYCLE)</text>
  </g>

  <!-- LOOP BACK DASHED TRACK -->
  <path d="M 120,890 H 95 V 305 H 145" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="6 4" fill="none" opacity="0.7" marker-end="url(#arr-cyan)"/>
  <text x="80" y="590" text-anchor="middle" fill="#06b6d4" font-size="11" font-weight="700" letter-spacing="1" transform="rotate(-90 80 590)">RECYCLE / SELECT()</text>

  <!-- STAGE 1 -->
  <g transform="translate(160, 160)">
    <rect width="1120" height="105" rx="16" fill="url(#glass-card)" stroke="#06b6d4" stroke-width="1.5" filter="url(#neon-cyan)"/>
    <line x1="0" y1="0" x2="0" y2="105" stroke="#06b6d4" stroke-width="6"/>

    <g transform="translate(30, 22)">
      <circle cx="30" cy="30" r="28" fill="#082f49"/>
      <path d="M 22,18 V 30 M 38,18 V 30 M 18,30 H 42 V 40 C 42,43 39,45 36,45 H 24 C 21,45 18,43 18,40 Z" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>

    <text x="110" y="42" fill="#38bdf8" font-size="12" font-weight="800" letter-spacing="1.5">ÉTAPE 01</text>
    <text x="110" y="70" fill="#f8fafc" font-size="20" font-weight="800">ÉCOUTE ET INITIALISATION</text>

    <text x="480" y="46" fill="#94a3b8" font-size="14">• Socket TCP non-bloquant</text>
    <text x="480" y="72" fill="#94a3b8" font-size="14">• Bind du port &amp; Listen</text>

    <rect x="860" y="32" width="230" height="42" rx="8" fill="#030712" stroke="#0284c7" stroke-width="1"/>
    <text x="975" y="58" text-anchor="middle" fill="#38bdf8" font-size="13" font-family="monospace" font-weight="700">Server.cpp</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 720,265 V 300" stroke="#06b6d4" stroke-width="2.5" fill="none" marker-end="url(#arr-cyan)"/>

  <!-- STAGE 2 -->
  <g transform="translate(160, 305)">
    <rect width="1120" height="110" rx="16" fill="url(#glass-card)" stroke="#a855f7" stroke-width="1.5" filter="url(#neon-purple)"/>
    <line x1="0" y1="0" x2="0" y2="110" stroke="#a855f7" stroke-width="6"/>

    <g transform="translate(30, 24)">
      <circle cx="30" cy="30" r="28" fill="#3b0764"/>
      <circle cx="30" cy="30" r="20" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="30" cy="30" r="10" fill="none" stroke="#c084fc" stroke-width="1.5"/>
      <path d="M 30,30 L 44,16" stroke="#e9d5ff" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <text x="110" y="42" fill="#c084fc" font-size="12" font-weight="800" letter-spacing="1.5">ÉTAPE 02</text>
    <text x="110" y="70" fill="#f8fafc" font-size="20" font-weight="800">MULTIPLEXAGE SELECT()</text>

    <text x="480" y="46" fill="#94a3b8" font-size="14">• Surveillance active (1024 FDs max)</text>
    <text x="480" y="72" fill="#94a3b8" font-size="14">• Détection non-bloquante des événements</text>

    <rect x="860" y="34" width="230" height="42" rx="8" fill="#030712" stroke="#7e22ce" stroke-width="1"/>
    <text x="975" y="60" text-anchor="middle" fill="#c084fc" font-size="13" font-family="monospace" font-weight="700">main.cpp (select loop)</text>
  </g>

  <!-- Branching Connectors -->
  <path d="M 430,415 V 460 H 400" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#arr-emerald)"/>
  <rect x="310" y="428" width="130" height="24" rx="6" fill="#030712" stroke="#10b981" stroke-width="1"/>
  <text x="375" y="444" text-anchor="middle" fill="#34d399" font-size="11" font-weight="800">NOUVEAU CLIENT</text>

  <path d="M 1010,415 V 460 H 1040" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#arr-emerald)"/>
  <rect x="990" y="428" width="140" height="24" rx="6" fill="#030712" stroke="#10b981" stroke-width="1"/>
  <text x="1060" y="444" text-anchor="middle" fill="#34d399" font-size="11" font-weight="800">DONNÉES ENTRANTES</text>

  <!-- STAGE 3A & 3B -->
  <!-- 3A: ACCEPT -->
  <g transform="translate(160, 465)">
    <rect width="530" height="125" rx="16" fill="url(#glass-card)" stroke="#10b981" stroke-width="1.5" filter="url(#neon-emerald)"/>
    <line x1="0" y1="0" x2="0" y2="125" stroke="#10b981" stroke-width="6"/>

    <g transform="translate(24, 24)">
      <circle cx="24" cy="24" r="24" fill="#064e3b"/>
      <path d="M 15,24 H 33 M 24,15 V 33" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <text x="85" y="35" fill="#34d399" font-size="11" font-weight="800" letter-spacing="1">3a. CONNEXION</text>
    <text x="85" y="60" fill="#f8fafc" font-size="18" font-weight="800">ACCEPT()</text>
    <text x="24" y="98" fill="#94a3b8" font-size="13">• Client accepté &amp; FD ajouté au tableau</text>

    <rect x="310" y="20" width="190" height="36" rx="6" fill="#030712" stroke="#047857" stroke-width="1"/>
    <text x="405" y="43" text-anchor="middle" fill="#34d399" font-size="12" font-family="monospace" font-weight="700">addClient()</text>
  </g>

  <!-- 3B: READ & BUFFER -->
  <g transform="translate(750, 465)">
    <rect width="530" height="125" rx="16" fill="url(#glass-card)" stroke="#10b981" stroke-width="1.5" filter="url(#neon-emerald)"/>
    <line x1="0" y1="0" x2="0" y2="125" stroke="#10b981" stroke-width="6"/>

    <g transform="translate(24, 24)">
      <circle cx="24" cy="24" r="24" fill="#064e3b"/>
      <path d="M 13,18 H 35 M 13,24 H 31 M 13,30 H 25" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <text x="85" y="35" fill="#34d399" font-size="11" font-weight="800" letter-spacing="1">3b. LECTURE</text>
    <text x="85" y="60" fill="#f8fafc" font-size="18" font-weight="800">RECV &amp; BUFFER</text>
    <text x="24" y="98" fill="#94a3b8" font-size="13">• Agrégation des paquets partiels (bufTmp)</text>

    <rect x="310" y="20" width="190" height="36" rx="6" fill="#030712" stroke="#047857" stroke-width="1"/>
    <text x="405" y="43" text-anchor="middle" fill="#34d399" font-size="12" font-family="monospace" font-weight="700">recv() + PUSH/DEL</text>
  </g>

  <!-- Connector Read -> Dispatch -->
  <path d="M 1015,590 V 630" stroke="#f59e0b" stroke-width="2.5" fill="none" marker-end="url(#arr-amber)"/>
  <rect x="940" y="598" width="150" height="22" rx="6" fill="#030712" stroke="#f59e0b" stroke-width="1"/>
  <text x="1015" y="613" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="800">COMMANDE COMPLÈTE</text>

  <!-- STAGE 4 -->
  <g transform="translate(160, 635)">
    <rect width="1120" height="120" rx="16" fill="url(#glass-card)" stroke="#f59e0b" stroke-width="1.5" filter="url(#neon-amber)"/>
    <line x1="0" y1="0" x2="0" y2="120" stroke="#f59e0b" stroke-width="6"/>

    <g transform="translate(30, 26)">
      <circle cx="30" cy="30" r="28" fill="#451a03"/>
      <path d="M 18,30 H 42 M 33,20 L 42,30 L 33,40" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="110" y="42" fill="#fbbf24" font-size="12" font-weight="800" letter-spacing="1.5">ÉTAPE 04</text>
    <text x="110" y="70" fill="#f8fafc" font-size="20" font-weight="800">DISPATCHING DES COMMANDES</text>

    <text x="490" y="46" fill="#94a3b8" font-size="14">• Routage dynamique (switch-case sur 12 commandes)</text>
    
    <!-- Mini Pills -->
    <g transform="translate(490, 62)">
      <rect x="0" y="0" width="60" height="24" rx="5" fill="#030712" stroke="#78350f" stroke-width="1"/><text x="30" y="16" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">JOIN</text>
      <rect x="70" y="0" width="80" height="24" rx="5" fill="#030712" stroke="#78350f" stroke-width="1"/><text x="110" y="16" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">PRIVMSG</text>
      <rect x="160" y="0" width="60" height="24" rx="5" fill="#030712" stroke="#78350f" stroke-width="1"/><text x="190" y="16" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">NICK</text>
      <rect x="230" y="0" width="60" height="24" rx="5" fill="#030712" stroke="#78350f" stroke-width="1"/><text x="260" y="16" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">MODE</text>
    </g>

    <rect x="860" y="38" width="230" height="42" rx="8" fill="#030712" stroke="#b45309" stroke-width="1"/>
    <text x="975" y="64" text-anchor="middle" fill="#fbbf24" font-size="13" font-family="monospace" font-weight="700">ServerSwitch.cpp</text>
  </g>

  <!-- Connector Dispatch -> Channels -->
  <path d="M 720,755 V 790" stroke="#f43f5e" stroke-width="2.5" fill="none" marker-end="url(#arr-rose)"/>

  <!-- STAGE 5 -->
  <g transform="translate(160, 795)">
    <rect width="1120" height="105" rx="16" fill="url(#glass-card)" stroke="#f43f5e" stroke-width="1.5" filter="url(#neon-rose)"/>
    <line x1="0" y1="0" x2="0" y2="105" stroke="#f43f5e" stroke-width="6"/>

    <g transform="translate(30, 22)">
      <circle cx="30" cy="30" r="28" fill="#4c0519"/>
      <circle cx="22" cy="24" r="9" fill="#fb7185"/>
      <circle cx="38" cy="24" r="9" fill="#f43f5e"/>
      <path d="M 13,42 C 13,34 30,34 30,42 M 30,42 C 30,35 47,35 47,42" stroke="#ffffff" stroke-width="2" fill="none"/>
    </g>

    <text x="110" y="42" fill="#fb7185" font-size="12" font-weight="800" letter-spacing="1.5">ÉTAPE 05</text>
    <text x="110" y="70" fill="#f8fafc" font-size="20" font-weight="800">CANAUX, MODES &amp; ÉTATS</text>

    <text x="490" y="46" fill="#94a3b8" font-size="14">• Gestion des membres, privilèges ops, topics &amp; modes</text>
    <text x="490" y="72" fill="#94a3b8" font-size="14">• Broadcast des messages au sein des canaux</text>

    <rect x="830" y="32" width="260" height="42" rx="8" fill="#030712" stroke="#be123c" stroke-width="1"/>
    <text x="960" y="58" text-anchor="middle" fill="#fb7185" font-size="12" font-family="monospace" font-weight="700">Channel.cpp / ServerMode.cpp</text>
  </g>

</svg>
