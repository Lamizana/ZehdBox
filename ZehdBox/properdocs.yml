# =============================== THEME DU SITE ================================
theme:
  name: material # mkdocs,readthedocs, material, pyodide-mkdocs-theme
  language: fr
  palette:
    # Toogle Mode clair :
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Passer en mode sombre

    # Toogle Mode sombre :
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Passer en mode clair

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.path
    - navigation.top
    - navigation.sections
    - navigation.prune
    - navigation.indexes
    - navigation.footer
    - navigation.expand

    # - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - header.autohide
    - content.tooltips

  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/bat
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16

  favicon: favicon.png

# ============================ EXTENSIONS MARKDOWN =============================
markdown_extensions:
  # Python Markdown
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - footnotes
  - def_list

  # Python Markdown Extensions
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.mark
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - css/custom.css

plugins:
  - search:
      lang: fr
  - social:
      cards_layout_options:
        font_family: Noto Sans

  - blog:
      authors_file: "{blog}/.authors.yml"
      blog_dir: blog

  - tags:
      enabled: true

  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
      categories:
        - categories

  - minify:
      minify_html: true

  - git-revision-date-localized:
      type: date
      locale: fr
      enable_creation_date: true

