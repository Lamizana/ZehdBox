name: Deploy ProperDocs site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: # bouton "Run workflow" manuel dans l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true # push rapide : annule le build précédent en cours

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique git COMPLET (obligatoire pour git-revision-date-localized)

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Cairo for social plugin)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev libffi-dev

      - name: Install Python dependencies
        run: pip install -r ZehdBox/requirements-ci.txt

      - name: Build site (strict)
        run: properdocs build -f ZehdBox/properdocs.yml --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ZehdBox/site

  deploy:
    needs: build # ne démarre que si le build a réussi
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
